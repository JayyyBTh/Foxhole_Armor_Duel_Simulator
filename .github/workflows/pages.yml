name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib numpy pillow

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Sanity-check the simulator
        run: python tank_duel.py --tests > /dev/null

      - name: Sync assets into docs/
        run: python scripts/sync_assets.py

      - name: Build matrix cache
        run: python scripts/build_matrix_cache.py

      - name: Render animation
        run: python scripts/render_animation.py

      - name: Drift check
        run: |
          diff tank_duel.py docs/assets/tank_duel.py
          diff tanks.json   docs/assets/tanks.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
